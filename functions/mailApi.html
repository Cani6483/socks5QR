<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱 API 批量取码</title>
    <link rel="stylesheet" type="text/css" href="./assets/socksQr.css">
</head>
<body>
    <main class="app-shell mail-app-shell">
        <section class="tool-panel">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Mail Toolkit</p>
                    <h1>邮箱 API 批量取码</h1>
                </div>
                <nav class="page-nav" aria-label="页面切换">
                    <a class="page-nav-link" href="./socks5QR.html">IP 二维码</a>
                    <a class="page-nav-link active" href="./mailApi.html">邮箱 API</a>
                </nav>
            </header>

            <div class="form-group">
                <label for="mailInput">邮箱账号</label>
                <textarea id="mailInput" rows="10" placeholder="例：user@example.com password&#10;一行一条"></textarea>
                <p class="field-hint">格式：邮箱账号 邮箱密码。系统会按邮箱自动选择 API，firstmail / Mail.td 。</p>
                <div id="codeStatus" class="error"></div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="mailProvider">邮件 API</label>
                    <select id="mailProvider">
                        <option value="auto">自动识别邮箱</option>
                    </select>
                </div>
            </div>

            <div class="mail-link-actions mail-api-actions">
                <button id="fetchCodes" class="primary-action" type="button">获取邮件验证码</button>
                <button id="copyApiLinks" class="secondary-action" type="button">一键复制API链接</button>
                <button id="copyCodes" class="secondary-action" type="button">一键复制验证码</button>
            </div>
            <div id="codeResults" class="mail-results"></div>
        </section>
    </main>

    <script src="./assets/mailApi.js"></script>
</body>
</html>
